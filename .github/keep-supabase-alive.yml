name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: sb_publishable_0hwZ3_WH0l9kBGu6hw4_Dw_Yg9_Hi0P" "https://srvpvlpvwgfiaogsaiiq.supabase.co/rest/v1/")
          echo "HTTP Status: $status"
          test "$status" -eq 200
